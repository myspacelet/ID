// Главный обработчик отправки формы в Supabase
async function handleAuthSubmit() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value.trim();
    const statusMsg = document.getElementById('auth-status-message');
    
    if (!email || !password) {
        if (statusMsg) {
            statusMsg.style.color = '#ef4444';
            statusMsg.innerHTML = "Заполните Email и Пароль";
        }
        return;
    }

    if (statusMsg) {
        statusMsg.style.color = '#64748b';
        statusMsg.innerHTML = '⏳ Обработка запроса спутником...';
    }

    if (currentAuthMode === 'register') {
        // ЛОГИКА ПОДАЧИ ЗАЯВКИ (РЕГИСТРАЦИЯ)
        const fullName = document.getElementById('auth-fullname').value.trim();
        const operatorId = document.getElementById('auth-operatorid').value.trim();

        if (!fullName || !operatorId) {
            if (statusMsg) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerHTML = "Укажите ваши Имя, Фамилию и ID";
            }
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName,
                    operator_id: operatorId
                }
            }
        });

        if (error) {
            if (statusMsg) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerHTML = "Ошибка: " + error.message;
            }
        } else {
            if (statusMsg) {
                statusMsg.style.color = '#16a34a';
                statusMsg.innerHTML = '✅ Заявка создана! Перейдите по ссылке в письме на почте для верификации, затем дождитесь одобрения админа.';
            }
            document.getElementById('auth-fullname').value = '';
            document.getElementById('auth-operatorid').value = '';
        }
    } else {
        // ЛОГИКА ВХОДА С УМНОЙ ПРОВЕРКОЙ
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            if (statusMsg) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerHTML = "Неверный логин или пароль";
            }
            return;
        }

        const user = data.user;
        // Запрашиваем флаг одобрения из таблицы public.profiles
        const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('approved')
            .eq('id', user.id)
            .single();

        if (profileError || !profile || profile.approved !== true) {
            await supabaseClient.auth.signOut();
            if (statusMsg) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerHTML = "🔒 Доступ ограничен. Администратор ещё не одобрил вашу заявку.";
            }
        } else {
            statusMsg.style.color = '#16a34a'; 
            statusMsg.innerHTML = '🚀 Доступ разрешен!';
            
            const welcomeTitle = document.getElementById('app-welcome-title');
            if (welcomeTitle && profile && profile.full_name) {
                // Отрезаем фамилию, оставляем только имя оператора
                const firstName = profile.full_name.trim().replace(/^[^\s]+\s+/, '');
                welcomeTitle.innerText = `🚌 Добро пожаловать, ${firstName}!`;
            }

            setTimeout(() => { 
                document.getElementById('auth-overlay').style.display = 'none'; 
            }, 800);
        }

    }
}

 const HFLABS_GEO_URL = "city.csv";
// Глобальный реестр городов (группирует одноименные точки в массивы)
let russianCitiesGeoCache = {};

async function loadExternalGeoDatabase() {
    const statusText = document.querySelector('.status-active');
    const originalStatus = statusText.innerHTML;
    
    try {
        statusText.innerHTML = "⏳ Загрузка гео-базы городов России...";
        
        const response = await fetch(HFLABS_GEO_URL);
        const csvText = await response.text();
        const lines = csvText.split('\n');
        
        const headers = lines[0].split(',');
        
        // Считываем индексы ВСЕХ нужных колонок, включая и city, и address
        const cityIdx = headers.indexOf('city');
        const addressIdx = headers.indexOf('address');
        const latIdx = headers.indexOf('geo_lat');
        const lngIdx = headers.indexOf('geo_lon');
        const tzIdx = headers.indexOf('timezone');
        const regionIdx = headers.indexOf('region');
        const popIdx = headers.indexOf('population');

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            
            let cityName = "";
            
            // 🌟 УМНАЯ ЛОГИКА ОПРЕДЕЛЕНИЯ ИМЕНИ ГОРОДА:
            if (cityIdx !== -1 && row[cityIdx] && row[cityIdx].replace(/"/g, '').trim() !== "") {
                cityName = row[cityIdx].replace(/"/g, '').trim().toLowerCase();
            } 
            // 2. Если 'city' пустой, берем данные из 'address' и вычищаем
            else if (addressIdx !== -1 && row[addressIdx]) {
                let rawAddress = row[addressIdx].replace(/"/g, '').trim().toLowerCase();
                cityName = rawAddress.replace(/^г\s+/, '').trim();
            }
            
            // Если имя города так и не удалось вытащить, или нет координат — пропускаем строку
            if (!cityName) continue;
            const lat = parseFloat(row[latIdx]);
            const lng = parseFloat(row[lngIdx]);
            if (isNaN(lat) || isNaN(lng)) continue; 

            const regionName = row[regionIdx] ? row[regionIdx].replace(/"/g, '').trim().toLowerCase() : "";
            const population = row[popIdx] ? parseInt(row[popIdx].replace(/"/g, ''), 10) : 0;
            
            // Перевод текстовой таймзоны в цифру
            const tzText = row[tzIdx] ? row[tzIdx].replace(/"/g, '').trim() : "UTC+3";
            let tzOffset = 3;
            if (tzText.includes('+')) {
                const parts = tzText.split('+');
                tzOffset = parts.length > 1 ? parseInt(parts[1], 10) : 3;
            } else if (tzText.includes('-')) {
                const parts = tzText.split('-');
                tzOffset = parts.length > 1 ? -parseInt(parts[1], 10) : 3;
            } else if (tzText.includes('Moscow') || tzText.includes('Volgograd')) tzOffset = 3;
            else if (tzText.includes('Samara')) tzOffset = 4;
            else if (tzText.includes('Yekaterinburg')) tzOffset = 5;
            else if (tzText.includes('Omsk')) tzOffset = 6;
            else if (tzText.includes('Novosibirsk') || tzText.includes('Krasnoyarsk')) tzOffset = 7;
            else if (tzText.includes('Irkutsk')) tzOffset = 8;
            else if (tzText.includes('Yakutsk')) tzOffset = 9;
            else if (tzText.includes('Vladivostok') || tzText.includes('Khabarovsk')) tzOffset = 10;
            else if (tzText.includes('Magadan') || tzText.includes('Sakhalin')) tzOffset = 11;

            const geoData = { 
                lat: lat, 
                lng: lng, 
                tz: tzOffset, 
                region: regionName.replace(/область|республика|край/g, '').trim(),
                population: population 
            };

            if (!russianCitiesGeoCache[cityName]) {
                russianCitiesGeoCache[cityName] = [];
            }
            russianCitiesGeoCache[cityName].push(geoData);
        }
        
        statusText.innerHTML = originalStatus;
        console.log(`🌍 Универсальный парсер загрузил базу: ${Object.keys(russianCitiesGeoCache).length} городов.`);
        
    } catch (err) {
        statusText.innerHTML = "🔴 Ошибка загрузки глобальной гео-базы";
        console.error(err);
    }
}

// Загрузка справочника из Google Таблицы с добавлением города в адрес
function loadDatabase() {
    const statusText = document.querySelector('.status-active');
    if (!GOOGLE_SCRIPT_URL) {
        statusText.innerHTML = "🔴 Ошибка: Ссылка на бэкенд отсутствует";
        return;
    }
    statusText.innerHTML = "⏳ Загрузка базы данных магазинов...";
    
    fetch(GOOGLE_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                statusText.innerHTML = "🔴 Ошибка базы: " + data.error;
            } else {
                // Модифицируем базу данных: склеиваем город и адрес сразу при загрузке
                for (let code in data) {
                    const store = data[code];
                    if (store.city && store.address) {
                        // Очищаем имя города от лишних пробелов
                        const cleanCity = store.city.trim();
                        // Если адрес уже начинается с этого города, не дублируем его
                        if (!store.address.toLowerCase().startsWith(cleanCity.toLowerCase())) {
                            store.address = `${cleanCity} ${store.address}`;
                        }
                    }
                }

                storeDatabase = data;
                statusText.innerHTML = `🟢 База городов: активна (${Object.keys(data).length} маг.)`;
            }
        })
        .catch(err => {
            statusText.innerHTML = "🔴 Нет связи с Google Таблицей";
            console.error(err);
        });
}

// Геометрическая формула расчета расстояния
function calculateDistance(lat1, lng1, lat2, lng2) {
    const R = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLng / 2) * Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
// Умный парсер грязных строк под формат "23 Братск2 3"
function parseDirtyList(text) {
    const lines = text.split('\n');
    const storesMap = new Map();
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        const strictMatch = line.match(/^\d+\s+([A-Za-zА-Яа-я0-9_#-]+)\s+(\d+)$/);
        if (strictMatch) {
            const code = strictMatch[1].trim();
            const stock = parseInt(strictMatch[2], 10);
            if (/^\d+$/.test(code) && code.length <= 3) continue; 
            storesMap.set(code, stock);
            continue;
        }
        if (line.includes(',') || line.includes('ул.') || line.includes('г.') || line.includes('обл.')) continue; 
        const words = line.split(/\s+/);
        if (words.length >= 3) {
            const firstWordNum = parseInt(words[0], 10);
            const lastWordNum = parseInt(words[words.length - 1], 10);
            const middleWord = words[1].replace(/[,.]/g, '').trim();
            if (!isNaN(firstWordNum) && !isNaN(lastWordNum) && middleWord.length > 2 && isNaN(parseInt(middleWord, 10))) {
                storesMap.set(middleWord, lastWordNum);
            }
        }
    }
    return storesMap;
}

function startSearch() {
    const activeLists = [];
    for (let i = 1; i <= 100; i++) {
        const textarea = document.getElementById(`list-${i}`);
        if (textarea && textarea.value.trim()) {
            activeLists.push(parseDirtyList(textarea.value));
        }
    }

    if (activeLists.length === 0) {
        alert("Пожалуйста, заполните хотя бы Список 1");
        return;
    }

    // Считываем значение нового фильтра количества товара
    const filterInput = document.getElementById('min-stock-filter').value.trim();
    const requiredStock = filterInput ? parseInt(filterInput, 10) : 0;

    let finalMatches = [];
    const addedExactCodes = new Set();

    // 1. НАХОДИМ ТОЧНЫЕ СОВПАДЕНИЯ ПО МАГАЗИНАМ (Строгое пересечение)
    if (activeLists.length === 1) {
        activeLists[0].forEach((stock, code) => {
            // ФИЛЬТР: Проверяем, хватает ли товара под запрос
            if (stock >= requiredStock) {
                finalMatches.push({ code, stock, isExact: true });
                addedExactCodes.add(code);
            }
        });
    } else {
        const firstMap = activeLists[0];
        firstMap.forEach((stockInFirst, code) => {
            let isInAll = true;
            let minStock = stockInFirst;

            for (let j = 1; j < activeLists.length; j++) {
                if (!activeLists[j].has(code)) {
                    isInAll = false;
                    break;
                } else {
                    minStock = Math.min(minStock, activeLists[j].get(code));
                }
            }
            
            // ФИЛЬТР: Магазин есть везде И минимального остатка в нём хватает под запрос
            if (isInAll && minStock >= requiredStock) {
                finalMatches.push({ code, stock: minStock, isExact: true });
                addedExactCodes.add(code);
            }
        });
    }

    // 2. НАХОДИМ МЯГКИЕ СОВПАДЕНИЯ ПО ГОРОДАМ (Если списков больше одного)
    if (activeLists.length > 1) {
        const listsOfCities = activeLists.map(storeMap => {
            const citySet = new Set();
            storeMap.forEach((stock, code) => {
                // УЧИТЫВАЕМ ФИЛЬТР: в Сет городов добавляем только те магазины, где товара хватает
                if (stock >= requiredStock) {
                    const dbItem = storeDatabase[code];
                    if (dbItem && dbItem.city) citySet.add(dbItem.city);
                }
            });
            return citySet;
        });

        const matchingCities = [];
        if (listsOfCities.length > 0) {
            listsOfCities[0].forEach(cityName => {
                let isCityInAll = true;
                for (let j = 1; j < listsOfCities.length; j++) {
                    if (!listsOfCities[j].has(cityName)) {
                        isCityInAll = false;
                        break;
                    }
                }
                if (isCityInAll) matchingCities.push(cityName);
            });
        }

        matchingCities.forEach(cityName => {
            activeLists.forEach(storeMap => {
                storeMap.forEach((stock, code) => {
                    const dbItem = storeDatabase[code];
                    
                    // УЧИТЫВАЕМ ФИЛЬТР: при сборе остатков мягкого поиска проверяем лимит
                    if (dbItem && dbItem.city === cityName && !addedExactCodes.has(code) && stock >= requiredStock) {
                        if (!finalMatches.some(s => s.code === code)) {
                            finalMatches.push({ code, stock, isExact: false, softCityKey: cityName });
                        }
                    }
                });
            });
        });
    }

    renderResults(finalMatches, "dynamic");
    
    const scrollNav = document.getElementById('scroll-nav');
    if (scrollNav) {
        scrollNav.classList.add('visible');
    }
    
    // Мягко опускаем экран к началу результатов
    scrollToBottom();
}

// Группировка по городам, сортировка и вывод результатов
function renderResults(storesArray, matchType) {
    const container = document.getElementById('results-rows-container');
    container.innerHTML = ''; 

    if (storesArray.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b; font-size:13px;">Совпадений не найдено 🤷‍♂️</div>`;
        document.getElementById('results-section').style.display = 'block';
        return;
    }

    const groupedRows = {};

    storesArray.forEach(item => {
        const dbItem = storeDatabase[item.code];
        let cityName = "Неизвестный код";
        
        if (dbItem) {
            cityName = (currentSearchMode === 'city') ? dbItem.city : item.code;
        } else if (item.softCityKey) {
            cityName = item.softCityKey;
        }

        const typeLabel = item.isExact ? "exact" : "soft";
        const groupKey = `${cityName}__${typeLabel}`;

        if (!groupedRows[groupKey]) {
            groupedRows[groupKey] = {
                cityName: cityName,
                isExact: item.isExact,
                stores: []
            };
        }
        groupedRows[groupKey].stores.push(item);
    });

    Object.keys(groupedRows).forEach(key => {
        const group = groupedRows[key];
        const row = document.createElement('div');
        row.className = 'result-row';

      // Привязываем имя города в нижнем регистре для удобного поиска
        row.setAttribute('data-city', group.cityName.trim().toLowerCase());

        const sortedStores = group.stores.sort((a, b) => b.stock - a.stock);
        const top3Stores = sortedStores.slice(0, 3);

        let badgesHtml = '';
        top3Stores.forEach(store => {
            // Если магазин точный, вешаем на него класс exact-badge для темной темы и базовый инлайн для светлой
            const badgeStyle = store.isExact 
                ? 'background: #f0fdf4; color: #16a34a; border: 2px solid #bbf7d0;' 
                : '';
            const exactClass = store.isExact ? 'exact-badge' : '';
            
            badgesHtml += `<button class="store-badge ${exactClass}" style="${badgeStyle}" onclick="openStoreCard('${store.code}')">${store.code} (${store.stock} шт)</button>`;
        });

        const matchLabel = group.isExact 
            ? `<span style="font-size:10px; color:#16a34a; background:#e1f5fe; padding:2px 6px; border-radius:4px; margin-left:8px; font-weight:700;">ТОЧНЫЙ МАГАЗИН</span>` 
            : `<span style="font-size:10px; color:#2563eb; background:#eff6ff; padding:2px 6px; border-radius:4px; margin-left:8px; font-weight:700;">СОВПАДЕНИЕ ПО ГОРОДУ</span>`;

        row.innerHTML = `
            <div class="result-city" style="display:flex; align-items:center;">${group.cityName} ${matchLabel}</div>
            <div class="badges-container">${badgesHtml}</div>
        `;
        container.appendChild(row);
    });

    document.getElementById('results-section').style.display = 'block';
}

async function fetchCoordinates(address) {
    // Добавляем к запросу ", Россия", чтобы OSM искал строго внутри страны
    const queryUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address + ", Россия")}&format=json&addressdetails=1&limit=1`;
    
    try {
        const res = await fetch(queryUrl, {
            headers: {
                // Сервис OSM требует указывать User-Agent, чтобы понимать, кто к ним обращается
                'User-Agent': 'StoreIntersectionTool/1.0'
            }
        });
        const data = await res.json();
        
        if (data && data.length > 0) {
            const result = data[0];
            const lat = parseFloat(result.lat);
            const lng = parseFloat(result.lon);
            
            // Пытаемся вытащить регион из ответа OSM для определения часового пояса
            const state = result.address ? (result.address.state || result.address.region || "") : "";
            
            // Простой и надежный расчет таймзоны по долготе (lng) прямо на фронтенде
            let tzOffset = 3; // По умолчанию Москва
            if (lng > 20 && lng <= 38.5) tzOffset = 3;
            else if (lng > 38.5 && lng <= 46.5) tzOffset = 3; 
            else if (lng > 46.5 && lng <= 51.5) tzOffset = 4; // Самара
            else if (lng > 51.5 && lng <= 69.5) tzOffset = 5; // Екатеринбург
            else if (lng > 69.5 && lng <= 79.5) tzOffset = 6; // Омск
            else if (lng > 79.5 && lng <= 99.5) tzOffset = 7; // Красноярск
            else if (lng > 99.5 && lng <= 114.5) tzOffset = 8; // Иркутск
            else if (lng > 114.5 && lng <= 127.5) tzOffset = 9; // Якутск
            else if (lng > 127.5 && lng <= 137.5) tzOffset = 10; // Владивосток
            else if (lng > 137.5 && lng <= 145.5) tzOffset = 11; // Магадан
            else if (lng > 145.5) tzOffset = 12; // Камчатка/Чукотка (ИСПРАВЛЕНО!)

            return { lat: lat, lng: lng, tz: tzOffset };
        }
        return null;
    } catch (e) {
        console.error("Критическая ошибка сети при поиске адреса через OSM:", e);
        return null;
    }
}

async function findNearestStore() {
    const userInput = document.getElementById('geo-search-input').value.trim();
    const output = document.getElementById('geo-result-output');
    
    if (!userInput) { alert("Введите адрес доставки клиента"); return; }

    // 1. Сканируем экран и собираем чистые города (без плашек "ТОЧНЫЙ МАГАЗИН")
    const cityElements = document.querySelectorAll('.result-city');
    const citiesOnScreen = [];
    cityElements.forEach(el => {
        let pureCity = el.textContent || el.innerText;
        pureCity = pureCity.replace(/(ТОЧНЫЙ МАГАЗИН|СОВПАДЕНИЕ ПО ГОРОДУ)/g, '').trim();
        pureCity = pureCity.replace(/[\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDFFF]/g, '').trim();
        if (pureCity && !citiesOnScreen.includes(pureCity)) citiesOnScreen.push(pureCity);
    });

    if (citiesOnScreen.length === 0) {
        output.style.color = '#ef4444';
        output.innerHTML = "⚠️ Сначала вставьте списки и найдите совпадения магазинов.";
        return;
    }

    output.style.color = '#64748b';
    output.innerHTML = `⏳ Спутник ищет координаты локации "${userInput}" во всемирной базе карт...`;

    try {
        let clientCoords = null;
        let geoNotice = "";

        // Разбираем ввод оператора
        const rawInput = userInput.trim().toLowerCase();
        const inputWords = rawInput.split(/[\s,]+/).filter(w => w.length > 0);
        
        if (inputWords.length > 0) {
            // ТЕСТ 1: Проверяем локальный кэш ( city.csv )
            let targetCityName = inputWords[0];
            let cityArray = russianCitiesGeoCache[targetCityName];

            if (!cityArray && inputWords.length > 1) {
                const doubleWordCity = `${inputWords[0]} ${inputWords[1]}`;
                if (russianCitiesGeoCache[doubleWordCity]) {
                    targetCityName = doubleWordCity;
                    cityArray = russianCitiesGeoCache[doubleWordCity];
                }
            }

            if (cityArray && cityArray.length > 0) {
                const regionFilterWords = inputWords.filter(w => w !== inputWords[0] && w !== inputWords[1])
                    .map(w => w.replace(/(область|обл|республика|край)/g, '').trim())
                    .filter(w => w.length > 0);

                if (regionFilterWords.length > 0) {
                    const filterText = regionFilterWords.join(' ');
                    clientCoords = cityArray.find(c => c.region.includes(filterText) || filterText.includes(c.region));
                } else {
                    cityArray.sort((a, b) => b.population - a.population);
                    clientCoords = cityArray[0];
                    if (cityArray.length > 1) {
                        geoNotice = ` <span style="font-size:11px; color:#64748b; display:block; margin-top:4px;">ℹ️ Выбрана крупнейшая точка (${clientCoords.region.toUpperCase()}). Можно уточнить регион через пробел.</span>`;
                    }
                }
            }
        }

        // ТЕСТ 2: НАДЁЖНЫЙ СПАСАТЕЛЬНЫЙ КРУГ (OpenStreetMap)
        if (!clientCoords) {
            output.innerHTML = `⏳ Спутник ищет "${userInput}" на подробных картах OpenStreetMap...`;
            clientCoords = await fetchCoordinates(userInput);
        }
        
        if (!clientCoords) {
            output.style.color = '#ef4444';
            output.innerHTML = "❌ Населенный пункт не найден. Проверьте правильность написания.";
            return;
        }

        // 3. МГНОВЕННЫЙ ПЕРЕБОР В ПАМЯТИ РАССТОЯНИЙ ДО ГОРОДОВ НА ЭКРАНЕ
        let minDistance = Infinity;
        let nearestCity = "";

        for (let cityName of citiesOnScreen) {
            let cleanCityName = cityName.replace(/\(.*?\)/g, '').trim().toLowerCase();
            cleanCityName = cleanCityName.replace(/[,.]/g, '').trim();
            
            let cityGeoArray = russianCitiesGeoCache[cleanCityName];
            if (!cityGeoArray) {
                const firstWord = cleanCityName.split(/[\s-]+/)[0];
                cityGeoArray = russianCitiesGeoCache[firstWord];
            }
            
            if (cityGeoArray && cityGeoArray.length > 0) {
                cityGeoArray.sort((a, b) => b.population - a.population);
                const cityGeo = cityGeoArray[0];

                // Считаем чистое расстояние по прямой (в км)
                const straightDist = calculateDistance(clientCoords.lat, clientCoords.lng, cityGeo.lat, cityGeo.lng);
                
                if (straightDist < minDistance) {
                    minDistance = straightDist;
                    nearestCity = cityName;
                }
            }
        }

        // 4. ВЫВОД РЕЗУЛЬТАТА С УЧЁТОМ ДОРОЖНОГО КОЭФФИЦИЕНТА И ВРЕМЕНИ КЛИЕНТА
        if (nearestCity) {
            // ЛОГИСТИЧЕСКИЙ КОРРЕКТИРОВОЧНЫЙ КОЭФФИЦИЕНТ:
            // Умножаем расстояние по прямой на 1.3 для симуляции реального автомобильного маршрута
            const roadDistance = Math.round(minDistance * 1.3);

            let clientTz = parseInt(clientCoords.tz, 10);
            if (isNaN(clientTz)) clientTz = 3; 

            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const localTimeOfClient = new Date(utc + (3600000 * clientTz));
            
            const hours = String(localTimeOfClient.getHours()).padStart(2, '0');
            const minutes = String(localTimeOfClient.getMinutes()).padStart(2, '0');

            const currentHours = localTimeOfClient.getHours();
            
            // Формируем красивый текст результата, явно указывая, что километраж дорожный
            if (currentHours >= 21 || currentHours < 8) {
                output.style.color = '#ef4444'; 
                output.innerHTML = `⚠️ Ближайшая точка: <strong>${nearestCity}</strong> (🚗 ~${roadDistance} км по трассе от ${userInput}, местное время клиента <strong>${hours}:${minutes}</strong>). ПОЗДНО ДЛЯ ЗВОНКА! ❌` + geoNotice;
            } else {
                output.style.color = '#ea580c'; 
                output.innerHTML = `💡 Ближайшая точка: <strong>${nearestCity}</strong> (🚗 ~${roadDistance} км по трассе от ${userInput}, местное время клиента <strong>${hours}:${minutes}</strong>)` + geoNotice;
            }
            
            // ЗАПУСКАЕМ КРАСИВУЮ ПОДСВЕТКУ СТРОКИ ГОРОДА НА ЭКРАНЕ
            highlightNearestCityRow(nearestCity);
          // 🔥 ФИЧА №5: Запоминаем город для домика и показываем кнопку!
            globalNearestCityName = nearestCity;
            const homeBtn = document.getElementById('btn-scroll-to-nearest');
            if (homeBtn) {
                homeBtn.style.display = 'block';
            }
            
        } else {
            output.style.color = '#ef4444';
            output.innerHTML = "⚠️ Не удалось сопоставить города на экране с гео-базой данных.";
        }

    } catch (err) {
        output.style.color = '#ef4444';
        output.innerHTML = "❌ Ошибка при динамическом расчете геоданных.";
        console.error(err);
    }
}

function resetAllForm() {
    // Находим динамические списки строго внутри их родного контейнера #lists-container
    const container = document.getElementById('lists-container');
    const dynamicLists = container.querySelectorAll('.input-group');
    
    // Удаляем только списки, начиная с третьего (индекс 2 и далее)
    dynamicLists.forEach((list, index) => { 
        if (index >= 2) list.remove(); 
    });
    
    // Сбрасываем глобальный счетчик до двух стартовых списков
    listCount = 2;
    
    // Очищаем текстовые поля первых двух списков
    const list1 = document.getElementById('list-1');
    const list2 = document.getElementById('list-2');
    if (list1) list1.value = '';
    if (list2) list2.value = '';
    
    // Безопасно обнуляем фильтр количества товара
    const minStockInput = document.getElementById('min-stock-filter');
    if (minStockInput) {
        minStockInput.value = '';
    }
    
    // Очищаем поля гео-поиска шага 3
    const geoInput = document.getElementById('geo-search-input');
    const geoOutput = document.getElementById('geo-result-output');
    if (geoInput) geoInput.value = '';
    if (geoOutput) geoOutput.innerHTML = '';
    
    // Скрываем карточку результатов
    const resSection = document.getElementById('results-section');
    if (resSection) resSection.style.display = 'none';
    
    const scrollNav = document.getElementById('scroll-nav');
    if (scrollNav) {
        scrollNav.classList.remove('visible');
    }
    // Скрываем кнопку-домик при сбросе формы
    const homeBtn = document.getElementById('btn-scroll-to-nearest');
    if (homeBtn) {
        homeBtn.style.display = 'none';
    }
    globalNearestCityName = ""; // Обнуляем имя города

    // Возвращаем фокус на первый список
    if (list1) list1.focus();
}
